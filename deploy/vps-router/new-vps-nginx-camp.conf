# Include inside the existing server block for clev.io on 194.238.23.242.
# Keep the request URI: proxy_pass intentionally has no trailing slash.
location ~ "^/camp(?:/|$)" {
    proxy_pass https://camp-origin.clev.io;
    proxy_http_version 1.1;
    proxy_set_header Host camp-origin.clev.io;
    proxy_set_header X-Forwarded-Host clev.io;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    proxy_ssl_server_name on;
    proxy_ssl_name camp-origin.clev.io;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
}
