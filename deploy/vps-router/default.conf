server {
    listen 80;
    server_name clev.io www.clev.io;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location = /camp {
        proxy_pass http://webclevio-test:3000;
    }

    location ^~ /camp/ {
        proxy_pass http://webclevio-test:3000;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name camp-origin.clev.io;

    proxy_http_version 1.1;
    proxy_set_header Host clev.io;
    proxy_set_header X-Forwarded-Host clev.io;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    location = /camp {
        proxy_pass http://webclevio-test:3000;
    }

    location ^~ /camp/ {
        proxy_pass http://webclevio-test:3000;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name test.clev.io;

    location = / {
        return 301 https://clev.io/camp;
    }

    location = /camp {
        return 301 https://clev.io$request_uri;
    }

    location ^~ /camp/ {
        return 301 https://clev.io$request_uri;
    }

    location / {
        return 301 https://clev.io/camp$request_uri;
    }
}

